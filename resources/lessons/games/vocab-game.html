<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Matching Game</title>
  <link rel="stylesheet" href="vocab-game.css">
</head>
<body>
    <header>
        <h1>1</h1>
    </header>

    <section class="subheader">
        <h2>Matching Game</h2>
    </section>

    

    <section class="game-section">

      <div class="rounds">
        <h3 id="round-selection">Round <span class="round-number">1</span></h3>
      </div>

      <div class="game">

        <div class="english-words">
          <button class="word" data-word="1">1</button>
          <button class="word" data-word="2">2</button>
          <button class="word" data-word="3">3</button>
          <button class="word" data-word="4">4</button>
          <button class="word" data-word="5">5</button>
        </div>
        <div class="japanese-words">
          <button class="word" data-word="あ">あ</button>
          <button class="word" data-word="い">い</button>
          <button class="word" data-word="う">う</button>
          <button class="word" data-word="え">え</button>
          <button class="word" data-word="お">お</button>
        </div>
      </div>
       
      <!-- End game buttons -->
      <div id="end-buttons" style="display:none;">
        <button id="try-again" class="end-game-button">Try Again</button>
        <button id="back-to-conversation" class="end-game-button">Back to Conversation</button>
      </div>


    <!-- Back to Conversation link-->

      </div>
        <p class="back-to-conversation">
            <a href="../index2.html">Back to Lesson</a>
        </p>
        <p class="back-to-main">
          <a href="../../../index.html">All Conversations</a>
        </p>
      </div>

    </section>


<!--Footer-->

  <footer>
    <p>&copy; 2024. All rights reserved.</p>

        & <a href="https://www.linkedin.com/in/teppei-nomura/" target="_blank">Teppei Nomura</a></p>
  </footer>

  <script src="vocab-game.js"></script>
</body>
</html>
